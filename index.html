<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WindowTabs</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">uTools 插件</p>
          <h1>WindowTabs</h1>
          <p class="subtitle">用 uTools 管理 WindowTabs 原生核心</p>
        </div>
        <span id="statusBadge" class="status-badge status-unknown">检测中</span>
      </header>

      <section class="card status-card">
        <div class="card-heading">
          <div>
            <h2>运行状态</h2>
            <p id="statusText" class="muted">正在连接 WindowTabs…</p>
            <p id="legacyHint" class="muted" hidden>兼容模式表示当前旧版核心已启动，但尚未提供 uTools IPC；WindowTabs 的托盘功能仍可使用。</p>
          </div>
          <button id="refreshButton" class="button button-quiet" type="button">刷新</button>
        </div>
        <dl class="status-grid">
          <div><dt>核心版本</dt><dd id="coreVersion">—</dd></div>
          <div><dt>进程号</dt><dd id="corePid">—</dd></div>
          <div><dt>标签组</dt><dd id="groupCount">—</dd></div>
          <div><dt>协议</dt><dd id="protocolVersion">—</dd></div>
        </dl>
        <p id="errorText" class="error-text" hidden></p>
      </section>

      <section class="card actions-card">
        <h2>操作</h2>
        <div class="button-row">
          <button id="startButton" class="button button-primary" type="button">启动核心</button>
          <button id="restartButton" class="button" type="button">重启核心</button>
          <button id="stopButton" class="button button-danger" type="button">停止核心</button>
          <button id="settingsButton" class="button" type="button">打开高级设置</button>
        </div>
      </section>

      <section class="card settings-card">
        <div class="card-heading">
          <div>
            <h2>常用设置</h2>
            <p class="muted">设置会写入 WindowTabs 原生配置并立即应用。</p>
          </div>
          <button id="loadConfigButton" class="button button-quiet" type="button">读取设置</button>
        </div>
        <div class="settings-grid">
          <label class="setting-row"><span>默认启用窗口标签</span><input id="enableTabbingByDefault" type="checkbox" /></label>
          <label class="setting-row"><span>隐藏非活动标签</span><input id="hideInactiveTabs" type="checkbox" /></label>
          <label class="setting-row"><span>显示标签预览</span><input id="enableTabPreview" type="checkbox" /></label>
          <label class="setting-row"><span>合并任务栏按钮</span><input id="groupTaskbarButtons" type="checkbox" /></label>
          <label class="setting-row"><span>预览延迟（毫秒）</span><input id="tabPreviewDelay" type="number" min="0" max="10000" step="50" /></label>
          <label class="setting-row"><span>预览尺寸（像素）</span><input id="tabPreviewSize" type="number" min="80" max="1200" step="10" /></label>
        </div>
        <div class="button-row settings-actions">
          <button id="saveConfigButton" class="button button-primary" type="button">应用设置</button>
          <span id="configStatus" class="muted" aria-live="polite"></span>
        </div>
      </section>

      <section class="card diagnostics-card">
        <div class="card-heading">
          <div>
            <h2>诊断</h2>
            <p class="muted">用于确认 helper、命名管道和运行环境是否正常。</p>
          </div>
          <button id="copyDiagnosticsButton" class="button button-quiet" type="button">复制诊断</button>
        </div>
        <pre id="diagnosticsOutput" class="diagnostics-output">尚未读取诊断信息</pre>
      </section>

      <footer class="footer">
        <span>WindowTabs 原生核心由独立 helper 负责窗口管理。</span>
        <span id="pluginVersion">插件 MVP</span>
      </footer>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
