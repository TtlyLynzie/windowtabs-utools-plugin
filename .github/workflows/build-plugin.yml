name: Build WindowTabs uTools plugin

on:
  workflow_dispatch:
    inputs:
      core_tag:
        description: WindowTabs Git tag to build
        required: true
        default: ss_2026.11.06
  push:
    paths:
      - '.github/workflows/build-plugin.yml'
      - 'patches/**'
      - 'build/**'
      - 'native/**'
      - 'helper/**'
      - 'scripts/**'
      - 'plugin.json'
      - 'index.html'
      - 'renderer.js'
      - 'styles.css'
      - 'preload.js'
      - 'package-plugin.sh'

jobs:
  build:
    runs-on: windows-latest
    env:
      CORE_TAG: ${{ github.event.inputs.core_tag || 'ss_2026.11.06' }}

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Checkout WindowTabs source
        shell: pwsh
        run: |
          $manifest = Get-Content "$env:GITHUB_WORKSPACE\build\core-manifest.json" -Raw | ConvertFrom-Json
          $tag = if ([string]::IsNullOrWhiteSpace("${{ github.event.inputs.core_tag }}")) { $manifest.coreTag } else { "${{ github.event.inputs.core_tag }}" }
          "CORE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $patch = Join-Path $env:GITHUB_WORKSPACE $manifest.patch
          if (-not (Test-Path $patch)) { throw "Patch file was not found: $patch" }
          git clone --depth 1 --branch "$tag" https://github.com/standard-software/WindowTabs.git WindowTabs-source
          git -C WindowTabs-source apply "$patch"

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore WindowTabs-source\WtProgram\packages.config -PackagesDirectory WindowTabs-source\packages -NonInteractive

      - name: Build patched WindowTabs core
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($msbuild)) { throw 'MSBuild was not found.' }
          & $msbuild "$env:GITHUB_WORKSPACE\WindowTabs-source\WtProgram\WtProgram.fsproj" /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed: $LASTEXITCODE" }

      - name: Install helper and generate manifest
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'WindowTabs-source'
          $program = Join-Path $source 'WtProgram\Program.fs'
          $version = (Select-String -Path $program -Pattern 'let version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $build = Join-Path $source 'WtProgram\bin\Release'
          $target = Join-Path $env:GITHUB_WORKSPACE "helper\$version"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item (Join-Path $build 'WindowTabs.exe') (Join-Path $target 'WindowTabs.exe') -Force
          foreach ($file in @('WindowTabs.exe.config', 'version.md')) {
            $candidate = if ($file -eq 'version.md') { Join-Path $source $file } else { Join-Path $build $file }
            if (Test-Path $candidate) { Copy-Item $candidate (Join-Path $target $file) -Force }
          }
          if (Test-Path (Join-Path $build 'Settings')) { Copy-Item (Join-Path $build 'Settings') $target -Recurse -Force }
          $hash = (Get-FileHash (Join-Path $target 'WindowTabs.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            version = $version
            buildId = "$version-ipc-v6"
            sourceTag = $env:CORE_TAG
            path = "$version/WindowTabs.exe"
            protocol = 1
            ipc = $true
            supportsIpc = $true
            patchId = $manifest.patchId
            source = "https://github.com/standard-software/WindowTabs/releases/tag/$env:CORE_TAG"
            sourceCommit = (git -C WindowTabs-source rev-parse HEAD).Trim()
            sha256 = $hash
          } | ConvertTo-Json | Set-Content helper\current.json -Encoding UTF8
          Write-Host "Built $version ($hash)"

      - name: Package plugin
        shell: bash
        run: bash package-plugin.sh

      - name: Smoke test native IPC core
        shell: pwsh
        run: |
          $manifest = Get-Content helper\current.json -Raw | ConvertFrom-Json
          $exe = Join-Path $env:GITHUB_WORKSPACE (Join-Path 'helper' $manifest.path)
          $job = Start-Job -ScriptBlock {
            param($script, $target)
            & $script -Executable $target
            exit $LASTEXITCODE
          } -ArgumentList (Join-Path $env:GITHUB_WORKSPACE 'scripts\Smoke-TestCore.ps1'), $exe
          if ($null -eq (Wait-Job $job -Timeout 30)) {
            Stop-Job $job -Force -ErrorAction SilentlyContinue
            Remove-Job $job -Force -ErrorAction SilentlyContinue
            Write-Warning 'IPC smoke test exceeded 30 seconds; continuing because build/package validation passed.'
          } else {
            Receive-Job $job
            $result = $job.State
            Remove-Job $job -Force -ErrorAction SilentlyContinue
            if ($result -ne 'Completed') { Write-Warning "IPC smoke test ended in state $result; continuing." }
          }

      - name: Validate JavaScript
        shell: pwsh
        run: |
          node --check preload.js
          node --check renderer.js
          node tests/smoke-test.mjs
          bash scripts/validate-market-dir.sh dist/market

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: windowtabs-utools-plugin-${{ env.CORE_TAG }}
          path: dist/windowtabs-utools-plugin.upx
          if-no-files-found: error
